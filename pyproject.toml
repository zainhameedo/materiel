[project]
name = "materiel"
version = "0.1.0"
description = "A working model of a defense manufacturer: parts, suppliers, builds and fielded fleet."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.3,<2",
    "flytekit>=1.16.31",
    "numpy>=2.4.6",
    "pandas>=2.3.3",
    "pyiceberg[pyarrow,sql-sqlite]>=0.12.0",
    "sqlmesh[duckdb]>=0.236.3",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/materiel"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
